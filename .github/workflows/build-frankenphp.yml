name: 🐳 FrankenPHP

on:
  push:
    branches: [main]
    paths:
      - 'frankenphp/**'
      - '.github/scripts/build-matrix.sh'
      - '.github/workflows/build-frankenphp.yml'
  pull_request:
    paths:
      - 'frankenphp/**'
      - '.github/scripts/build-matrix.sh'
      - '.github/workflows/build-frankenphp.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/sliknl/frankenphp
  # Only main publishes. Pull requests and manual runs on other branches build without a push.
  PUSH: ${{ github.event_name != 'pull_request' && github.ref_name == 'main' }}

jobs:
  versions:
    name: Read versions
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One matrix entry per PHP version in frankenphp/versions.json, with the image tags for it.
      - name: Build matrix
        id: matrix
        run: |
          matrix="$(.github/scripts/build-matrix.sh frankenphp/versions.json)"
          echo "$matrix" | jq .
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.php.id }} ${{ matrix.arch }}
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.versions.outputs.matrix) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On main the image is pushed by digest only. The manifest job attaches the tags.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frankenphp
          platforms: linux/${{ matrix.arch }}
          build-args: BASE_TAG=${{ matrix.php.base_tag }}
          outputs: ${{ env.PUSH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || '' }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.php.id }}-${{ matrix.arch }}
          cache-to: ${{ env.PUSH == 'true' && format('type=registry,ref={0}:buildcache-{1}-{2},mode=max', env.IMAGE, matrix.php.id, matrix.arch) || '' }}

      - name: Export digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.php.id }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Manifest ${{ matrix.php.id }}
    needs: [versions, build]
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.versions.outputs.matrix) }}
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.php.id }}-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ matrix.php.tags }}
        run: |
          tag_args=()
          IFS=',' read -ra tag_array <<< "$TAGS"
          for tag in "${tag_array[@]}"; do
            tag_args+=("-t" "${IMAGE}:${tag}")
          done
          digest_refs=()
          for digest_file in *; do
            digest_refs+=("${IMAGE}@sha256:${digest_file}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${digest_refs[@]}"

      - name: Inspect manifest
        env:
          TAGS: ${{ matrix.php.tags }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${TAGS%%,*}"
